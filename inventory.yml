# ASSUMPTIONS TO CHECK (edit here, nowhere else):
#   - the three nodes are pi5-8a, pi5-8b, pi5-8c
#   - pi5-8a is the server (control plane); the other two are workers
#   - the login user on every node is jmh, with your SSH key and sudo
#   - each hostname resolves from the machine you run Ansible on;
#     if not, add  ansible_host: <ip>  under that host
k3s_cluster:
  children:
    server:
      hosts:
        pi5-8a:
    agent:
      hosts:
        pi5-8b:
        pi5-8c:
  vars:
    ansible_user: jmh
    ansible_port: 22

    # Set to a current stable release from https://github.com/k3s-io/k3s/releases
    # (form: v1.xx.y+k3s1). Upgrades = change this line, run the upgrade playbook.
    k3s_version: "SET_ME"

    # Kept encrypted in group_vars/k3s_cluster/vault.yml
    token: "{{ vault_k3s_token }}"

    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
