# Up/down checks with phone alerts.  http://<any node>:30031
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: uptime-kuma-data, namespace: monitoring}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: uptime-kuma, namespace: monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: uptime-kuma}}
  template:
    metadata: {labels: {app: uptime-kuma}}
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1
          ports:
            - {containerPort: 3001}
          volumeMounts:
            - {name: data, mountPath: /app/data}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: uptime-kuma-data}
---
apiVersion: v1
kind: Service
metadata: {name: uptime-kuma, namespace: monitoring}
spec:
  type: NodePort
  selector: {app: uptime-kuma}
  ports:
    - {port: 3001, targetPort: 3001, nodePort: 30031}
